name: CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - x86
        node:
          - 17
          - 8
          - 10
          - 12
          - 14
          - 16
        os:
          - macOS-latest
          - ubuntu-22.04
          - ubuntu-24.04
          - windows-latest
        exclude:
          - arch: x86
            os: macOS-latest
          - arch: x86
            os: ubuntu-22.04
          - arch: x86
            os: ubuntu-24.04
          - node: 8
            os: macOS-latest
          - node: 10
            os: macOS-latest
          - node: 12
            os: macOS-latest
          - node: 14
            os: macOS-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.arch }}
      - name: Pin npm registry to the release-date time machine (Node 8 only)
        if: matrix.node == 8
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2022-02-07T19:43:39.492000Z
        shell: bash
      - run: npm install
      - run: npm test
      - name: Pack the release tarball
        if: matrix.os == 'ubuntu-24.04' && matrix.node == 17 && matrix.arch == 'x64'
        run: npm pack
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04' && matrix.node == 17 && matrix.arch == 'x64'
        with:
          name: npm-tarball
          path: '*.tgz'
          if-no-files-found: error
      - run:
          echo ::set-output name=job_id::$(node -e
          "console.log(crypto.randomBytes(16).toString('hex'))")
        id: get_job_id
        shell: bash
